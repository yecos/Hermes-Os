<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de gastos</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:1rem;background:#f4f4f4;color:#333}
h1{font-size:1.5rem;margin-bottom:.5rem}
form{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
label{display:block;font-weight:bold;margin-bottom:.2rem}
input{padding:.4rem;border:1px solid #ccc;border-radius:4px;width:100%}
input[type=number]{-moz-appearance:textfield}
button{padding:.5rem 1rem;background:#0066cc;color:#fff;border:none;border-radius:4px;cursor:pointer}
button:hover{background:#005bb5}
#message{color:#d00;margin-bottom:.5rem}
#expense-list{list-style:none;padding:0;margin:0}
#expense-list li{background:#fff;padding:.5rem;margin-bottom:.3rem;border-radius:4px;display:flex;justify-content:space-between;align-items:center}
#expense-list li span{flex:1}
#expense-list li button{background:#c00;color:#fff;border:none;border-radius:4px;padding:.2rem .5rem;cursor:pointer}
#total{font-weight:bold;margin-top:1rem}
@media(min-width:600px){form{flex-wrap:nowrap}
label{width:120px}
input{width:calc(100% - 120px)}
}
</style>
</head>
<body>
<h1>Control de gastos</h1>
<div id="message" aria-live="polite"></div>
<form id="expense-form" novalidate>
<label for="date">Fecha</label>
<input type="date" id="date" required>
<label for="category">Categoría</label>
<input type="text" id="category" required>
<label for="amount">Cantidad (COP)</label>
<input type="number" id="amount" min="1" step="1" required>
<button type="submit" id="add">Agregar</button>
</form>
<label for="filter">Filtrar por categoría:</label>
<select id="filter"><option value="all">Todas</option></select>
<ul id="expense-list"></ul>
<div id="total" data-total="0">Total: 0 COP</div>
<script>
(function(){
const STORAGE_KEY='hermes_expenses_v1';
const form=document.getElementById('expense-form');
const dateInput=document.getElementById('date');
const categoryInput=document.getElementById('category');
const amountInput=document.getElementById('amount');
const list=document.getElementById('expense-list');
const totalEl=document.getElementById('total');
const filterSel=document.getElementById('filter');
const messageEl=document.getElementById('message');
let expenses=[];
function load(){const data=localStorage.getItem(STORAGE_KEY);expenses=data?JSON.parse(data):[];render();}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(expenses));}
function addExpense(e){e.preventDefault();messageEl.textContent='';const date=dateInput.value;const cat=categoryInput.value.trim();const amt=parseInt(amountInput.value,10);if(!date){messageEl.textContent='La fecha es obligatoria.';return;}if(!cat){messageEl.textContent='La categoría no puede estar vacía.';return;}if(isNaN(amt)||amt<1){messageEl.textContent='La cantidad debe ser un número entero positivo.';return;}const id=Date.now();expenses.push({id,date,cat,amt});save();render();form.reset();}
function deleteExpense(id){expenses=expenses.filter(e=>e.id!==id);save();render();}
function render(){list.innerHTML='';const filter=filterSel.value;let sum=0;expenses.forEach(e=>{if(filter==='all'||e.cat===filter){const li=document.createElement('li');const span=document.createElement('span');span.textContent=`${e.date} - ${e.cat} - ${e.amt} COP`;const delBtn=document.createElement('button');delBtn.textContent='Eliminar';delBtn.dataset.delete=e.id;delBtn.addEventListener('click',()=>deleteExpense(e.id));li.append(span,delBtn);list.appendChild(li);}sum+=e.amt;});totalEl.dataset.total=sum;totalEl.textContent=`Total: ${sum} COP`;populateFilter();}
function populateFilter(){const cats=[...new Set(expenses.map(e=>e.cat))];filterSel.innerHTML='<option value="all">Todas</option>';cats.forEach(c=>{const opt=document.createElement('option');opt.value=c;opt.textContent=c;filterSel.appendChild(opt);});}
filterSel.addEventListener('change',render);
form.addEventListener('submit',addExpense);
load();
})();
</script>
</body>
</html>
