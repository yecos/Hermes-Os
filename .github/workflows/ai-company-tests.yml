name: Hermes AI Company tests

on:
  pull_request:
    paths:
      - "ai-company/**"
      - ".github/workflows/ai-company-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify task reviews, escalation and approval logic
        run: python -m unittest discover -s ai-company/tests -v
