name: Hermes Telegram helper checks
on:
  pull_request:
    paths:
      - "scripts/hermes-telegram-activate.sh"
      - "docs/HERMES_TELEGRAM_ACTIVATION.md"
      - ".github/workflows/hermes-telegram-activation-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash -n scripts/hermes-telegram-activate.sh
      - run: bash scripts/hermes-telegram-activate.sh --help
