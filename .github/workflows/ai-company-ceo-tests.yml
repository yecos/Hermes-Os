name: Hermes AI Company CEO tests
on:
  pull_request:
    paths:
      - "ai-company/commerce-ceo/**"
      - ".github/workflows/ai-company-ceo-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s ai-company/commerce-ceo/tests -v
