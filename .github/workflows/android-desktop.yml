name: Android Desktop

on:
  push:
    branches:
      - main
      - feature/hermes-desktop-android
    paths:
      - "android-desktop/**"
      - ".github/workflows/android-desktop.yml"
  pull_request:
    paths:
      - "android-desktop/**"
      - ".github/workflows/android-desktop.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-debug
          path: android-desktop/app/build/outputs/apk/debug/app-debug.apk
