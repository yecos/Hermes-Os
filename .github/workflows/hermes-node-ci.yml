name: Hermes Node CI

on:
  push:
    paths:
      - "hermes-node/**"
      - ".github/workflows/hermes-node-ci.yml"
  pull_request:
    paths:
      - "hermes-node/**"
      - ".github/workflows/hermes-node-ci.yml"

concurrency:
  group: hermes-node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: hermes-node/go.mod

      - name: Test
        run: go test ./...

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/hermes-node-linux-amd64 ./cmd/hermes-node

      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/hermes-node-windows-amd64.exe ./cmd/hermes-node

      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/hermes-node-linux-arm64 ./cmd/hermes-node

      - name: Build Android arm64
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/hermes-node-android-arm64 ./cmd/hermes-node
